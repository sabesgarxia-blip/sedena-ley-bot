# fly.toml app configuration file generated for sedena-ley-bot on 2026-11-12T16:34:23Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'sedena-ley-bot'
primary_region = 'cdg'

[deploy]
  strategy = 'immediate'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
